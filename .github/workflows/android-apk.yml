name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk 记忆宫殿-MemoryPalace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: memory-palace-apk
          path: 记忆宫殿-MemoryPalace.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 记忆宫殿 Android APK
          body: |
            Kotlin + Jetpack Compose 安卓客户端（内置完整 3D 记忆宫殿应用，支持触屏操作）。
            下载 APK 后在手机上安装即可（需允许安装未知来源应用）。
          files: 记忆宫殿-MemoryPalace.apk
          make_latest: true
